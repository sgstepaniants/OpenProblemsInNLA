automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: >-
      Multiple problem agents; drafting on macOS; all actual Lean statement,
      proof and Comparator checks are assigned to non-root Linux. No local
      Lean/Lake/cache download or execution is authorized.
    prompting_notes: >-
      State the full target before proof bodies. Preserve the exact eight
      coefficient blocks, complex field, singular condition-number convention,
      every positive parameter including rho squared equals10, all growing
      dimensions and the actual inverse. Use exact small-matrix algebra and
      the permitted exponent2 to eliminate intervals, root numerics and
      unnecessary sharp norm estimates. Require LeanCert kernel trust for
      every eventual export and independent Comparator with no definition holes.
  notes: >-
    AI-assisted statement draft by /root/next_matrix_functions. Exact Gaussian
    integer polynomial diagnostics are supplementary source-data checks only.
    No proof body, Lean acceptance or independent statement approval is claimed.
status:
  scope: >-
    Definitions and22 deliberate Challenge placeholders only. All proof,
    independent-review, statement-typecheck, freeze and mechanical acceptance
    gates are pending. No verified-count increment or repository status change.
  main_results: []
fidelity:
  divergences: >-
    The original question asks for some nonnegative polynomial exponent. The
    draft proves the full target using exponent2, via coarse dimension times
    entry bounds on both actual matrices. The source's sharper exponent1 is
    not claimed. Direct fixed-size determinant/cofactor certificates replace
    the source's formal-generating-function denominator inference. All domains,
    coefficient blocks, boundary entries, invertibility requirements and the
    exceptional positive parameter remain unchanged.
review:
  status: unreviewed statement-only draft; all proof and mechanical gates pending
  reviewers: []
  notes: >-
    Two independent statement reviews and actual Linux elaboration precede
    an immutable freeze and any proof bodies. Final acceptance requires two
    independent referees applying scoped Tau Ceti fidelity, proof-quality,
    reuse and attribution criteria, all LeanCert kernel assertions, the actual
    permitted-axiom audit, Comparator, default-kernel replay and rejection
    controls. No official Tau Ceti endorsement or human peer review is claimed.
