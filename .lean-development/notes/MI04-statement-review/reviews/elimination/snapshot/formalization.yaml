automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Multiple problem agents. This agent writes source and read-only audits on macOS; the coordinator
      runs later non-root Linux elaboration, builds and Comparator. No local Lean/Lake/cache execution
      is authorized.
    prompting_notes: Write complete numerical obligations and definitions before proofs. Keep all positive
      dimensions, singular/repeated cases, all Hermitian A/B PSD completions and actual complex Euclidean
      norm. Replace analytic perturbation by an exact Rayleigh sandwich and two rational diagonal probes.
      Require two independent statement reviews, actual elaboration, then LeanCert kernel trust and independent
      final Comparator/axiom/control referees.
  notes: AI-assisted statement-only draft by /root/next_inequalities. No proof body, independent approval,
    Lean execution, official Tau Ceti endorsement, human peer review or source-author endorsement is claimed.
status:
  scope: Definitions and 21 independent Challenge obligations only. No proof implementation, frozen boundary,
    successful elaboration, Comparator acceptance or verified-count increment.
  main_results: []
fidelity:
  divergences: The full original necessity implication is retained; the manuscript converse and four-way
    equivalence are not claimed. An exact Rayleigh-quotient sandwich replaces analytic eigenvalue-branch
    perturbation. Only diagonal probes 1,0,1/2 are needed. The equivalent normalized vectors (1,1,1) and
    (1,I,-1-I) replace cube roots of unity for the collinearity step. None of these changes adds a final
    hypothesis or changes the requested conclusion.
review:
  status: unreviewed statement-only draft; all proof and mechanical gates pending
  reviewers: []
  notes: Two independent source-bound statement approvals and actual Linux elaboration must precede the
    freeze and all proof implementation. Two independent final referees must inspect complete source and
    authentic Comparator/default-kernel/axiom/control evidence. Source-only checks do not verify a problem.
