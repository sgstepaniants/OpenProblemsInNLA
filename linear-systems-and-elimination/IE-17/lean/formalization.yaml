    status: Complete Linux compilation accepted; final package audit pending.
  - source: Exact LSMR first three iterates and minimum-length semantics
    lean: NLA.IE17.witness_iterates
    module: NLA/IE17/Iterates.lean
    status: Complete Linux compilation accepted; final package audit pending.
  - source: Actual Moore-Penrose augmented projection and scalar reduction
    lean: NLA.IE17.projectionError_sq_formula
    module: NLA/IE17/Projection.lean
    status: Complete Linux compilation accepted; final package audit pending.
  - source: Rational feasible upper perturbation and positive Gram certificate
    lean: NLA.IE17.upperPerturbation_certificate
    module: NLA/IE17/Certificates.lean
    status: Complete Linux compilation accepted; final package audit pending.
  - source: Universal lower bound, including zero new residual
    lean: NLA.IE17.every_second_perturbation_large
