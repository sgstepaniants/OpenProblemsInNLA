automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Statement-first development after two independent statement reviews and actual Linux declaration
      elaboration. LeanCert kernel assertions accompany the seventeen exported targets. All Lean and Lake
      execution is delegated to non-root GitHub-hosted Linux; no local compiler or dependency/cache download
      is used.
    prompting_notes: Preserve actual Euclidean and spectral norms, whole Krylov-space minimum-length optimization,
      all feasible real perturbations, attained infimum, all four Penrose identities, and the complete
      projection-to-rational-expression bridge. Eliminate interval work through rational LDL factorizations
      and unnormalized residuals.
  - method: agent
    framework: OpenAI Codex
    tool_setup: Separate independent agents review statement fidelity, universal quantifiers, certificates,
      proof quality and actual verification receipts under the repository's adapted Tau Ceti protocol.
      Source reviewers do not count as their own independent proof referees.
  notes: Substantial AI assistance; no external human peer review, source-author endorsement, official
    Tau Ceti service, priority claim or measured cost is asserted. Python rational checks format/check
    supplementary data; their outputs are never trusted mathematical premises in Lean.
