review:
  status: Two independent statement and proof-source approvals; final compiled-byte addenda pending.
  reviewers:
  - /root/next_matrix_functions (independent AI statement referee)
  - /root (AI statement referee and proof coordinator)
  - /root/next_inequalities (independent AI proof-source referee)
  notes: The source implementer /root/next_elimination does not count as its own independent referee.
    A referee detected that the supplementary lower LDL pivots were scaled for K/2407881992100; the implementation
    now multiplies those pivots by 2407881992100 before proving the frozen integer-K factorization. The
    repaired factorization was accepted in Linux; final source and actual compiled evidence still require
    both independent final approvals.
fidelity:
  divergences: No canonical quantifier or norm is weakened. The proof works with the actual unnormalized
    new residual to eliminate unit-vector square roots, handles the zero-new-residual branch separately,
    and proves the full perturbation minimum is attained before transferring a strict bound to the infimum.
    Exact rational LDL witnesses replace determinant expansion; all factorizations and operator-norm bridges
    remain Lean obligations. The dense orthogonal variant, Frobenius norms, and floating-point recurrences
    are outside the canonical claim and are not asserted.
